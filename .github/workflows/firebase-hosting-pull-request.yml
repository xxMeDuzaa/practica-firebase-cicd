# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# A1: corre en cada Pull Request (apertura, nuevos commits y reapertura).
on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

# A4: un push nuevo al mismo PR cancela el build anterior (el viejo ya no sirve).
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: en un PR, github.sha es el merge commit sintético; el commit real
      #     de la rama es pull_request.head.sha, y la rama es github.head_ref.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      # Desafío extra: reemplaza 'unsafe-inline' de script-src por los hashes
      # sha256 de los scripts inline que generó ESTE build (cambian en cada commit).
      - name: CSP con hashes de scripts inline
        run: node scripts/csp-hashes.mjs

      - name: Deploy a preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # A3: secreto creado por `firebase init hosting:github`
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CI_CD }}
          projectId: practica-ci-cd
          # A3: el preview vence solo a los 3 días (sin URLs huérfanas públicas).
          expires: 3d

      # Gate de verificación: si el preview no tiene los headers, el check falla
      # y el PR queda en rojo antes de mergear.
      # Un canal recién creado puede tardar unos segundos en responder (404),
      # así que primero se espera a que devuelva 200 (máx. ~2 minutos).
      - name: Verificar headers en el preview
        timeout-minutes: 5
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$PREVIEW_URL/")
            echo "Intento $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          node scripts/check-headers.mjs "$PREVIEW_URL"
