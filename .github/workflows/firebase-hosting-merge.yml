# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

# A1: corre en cada push a main (incluye el merge de un PR).
on:
  push:
    branches:
      - main

permissions:
  contents: read

# A4: los deploys a producción hacen fila y NUNCA se cancelan a mitad de camino.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A5: environment `production` (en Settings → Environments se puede exigir
    #     aprobación manual de un revisor antes de que este job arranque).
    environment:
      name: production
      url: https://practica-ci-cd.web.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: en un push, github.sha es el commit de main y ref_name es "main".
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: CSP con hashes de scripts inline
        run: node scripts/csp-hashes.mjs

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # A3: mismo secreto que en el workflow de PR.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CI_CD }}
          projectId: practica-ci-cd
          # A3: "live" publica en producción (<project>.web.app).
          channelId: live

      - name: Verificar headers en producción
        timeout-minutes: 5
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "https://practica-ci-cd.web.app/")
            [ "$code" = "200" ] && break
            sleep 5
          done
          node scripts/check-headers.mjs "https://practica-ci-cd.web.app"
